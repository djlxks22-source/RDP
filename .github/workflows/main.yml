name: OmniAudio Cloud (RDP + GUI)

on:
  workflow_dispatch:

jobs:
  omniaudio-cloud:
    runs-on: windows-2022
    timeout-minutes: 3600

    steps:
      - name: Habilitar RDP (sem NLA pra facilitar conexão)
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "SecurityLayer" -Value 0 -Force

          netsh advfirewall firewall add rule name="RDP" dir=in action=allow protocol=TCP localport=3389

          Restart-Service -Name TermService -Force

      - name: Criar usuário RDP seguro e único
        run: |
          $username = "OmniRDP"
          \( passwordPlain = "Omni2026_ \){{ github.run_id }}!"
          $securePass = ConvertTo-SecureString $passwordPlain -AsPlainText -Force

          if (-not (Get-LocalUser -Name $username -ErrorAction SilentlyContinue)) {
              New-LocalUser -Name $username -Password $securePass -AccountNeverExpires -PasswordNeverExpires
          }

          Add-LocalGroupMember -Group "Administrators" -Member $username -ErrorAction SilentlyContinue
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member $username -ErrorAction SilentlyContinue

          echo "RDP_USER=$username" >> $env:GITHUB_ENV
          echo "RDP_PASSWORD=$passwordPlain" >> $env:GITHUB_ENV

      - name: Instalar Tailscale
        run: |
          $tsUrl = "https://pkgs.tailscale.com/stable/tailscale-setup-latest-amd64.msi"
          $installer = "$env:TEMP\tailscale.msi"
          Invoke-WebRequest -Uri $tsUrl -OutFile $installer
          Start-Process msiexec.exe -ArgumentList "/i `"$installer`" /quiet /norestart" -Wait
          Remove-Item $installer -Force

      - name: Conectar Tailscale
        run: |
          & "$env:ProgramFiles\Tailscale\tailscale.exe" up `
            --authkey=${{ secrets.TAILSCALE_AUTH_KEY }} `
            --hostname=omniaudio-${{ github.run_id }} `
            --accept-routes --accept-dns=false --reset

          $tsIP = $null
          $retries = 0
          while (-not $tsIP -and $retries -lt 20) {
              $tsIP = (& "$env:ProgramFiles\Tailscale\tailscale.exe" ip -4) -replace '\s+', ''
              Start-Sleep -Seconds 5
              $retries++
          }
          if (-not $tsIP) { Write-Error "Tailscale IP não encontrado"; exit 1 }
          echo "TAILSCALE_IP=$tsIP" >> $env:GITHUB_ENV

      - name: Clonar o repositório OmniAudio
        uses: actions/checkout@v4
        with:
          repository: Kayckyy/Omni  # ← seu repo
          path: Omni

      - name: Instalar dependências Python do OmniAudio
        run: |
          python -m pip install --upgrade pip
          pip install pyqt5 pyqtgraph pyopengl numpy scipy soundfile pydub ffmpeg-python

      - name: Instalar Chocolatey + apps úteis
        run: |
          Set-ExecutionPolicy Bypass -Scope Process -Force
          [System.Net.ServicePointManager]::SecurityProtocol = [System.Net.ServicePointManager]::SecurityProtocol -bor 3072
          iex ((New-Object System.Net.WebClient).DownloadString('https://community.chocolatey.org/install.ps1'))

          choco install -y vcredist140 directx vulkan googlechrome 7zip

      - name: Iniciar GUI do OmniAudio em background
        run: |
          cd OmniAudio
          Start-Process powershell -ArgumentList "-NoExit -Command python main.py gui" -WindowStyle Hidden

      - name: Exibir credenciais RDP (último passo)
        run: |
          Write-Host "`n=== ACESSO RDP AO OMNIAUDIO ==="
          Write-Host "IP Tailscale: $env:TAILSCALE_IP"
          Write-Host "Usuário: $env:RDP_USER"
          Write-Host "Senha: $env:RDP_PASSWORD"
          Write-Host "Porta: 3389 (RDP)"
          Write-Host "================================`n"
          Write-Host "Conecte via Remote Desktop (mstsc.exe)"
          Write-Host "A GUI do OmniAudio já está rodando em background."
          Write-Host "Sessão válida por até 60 horas."
          while ($true) { Start-Sleep -Seconds 300 }          Add-LocalGroupMember -Group "Administrators" -Member $username
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member $username

          echo "RDP_USER=$username" >> $env:GITHUB_ENV
          echo "RDP_PASSWORD=$passwordPlain" >> $env:GITHUB_ENV

      - name: Install Tailscale
        run: |
          $tsUrl = "https://pkgs.tailscale.com/stable/tailscale-setup-1.82.0-amd64.msi"
          $installerPath = "$env:TEMP\tailscale.msi"
          Invoke-WebRequest -Uri $tsUrl -OutFile $installerPath
          Start-Process msiexec.exe -ArgumentList "/i", "`"$installerPath`"", "/quiet", "/norestart" -Wait
          Remove-Item $installerPath -Force

      - name: Establish Tailscale Connection
        run: |
          & "$env:ProgramFiles\Tailscale\tailscale.exe" up --authkey=${{ secrets.TAILSCALE_AUTH_KEY }} --hostname=gh-runner-$env:GITHUB_RUN_ID
          $tsIP = $null
          $retries = 0
          while (-not $tsIP -and $retries -lt 10) {
              $tsIP = & "$env:ProgramFiles\Tailscale\tailscale.exe" ip -4
              Start-Sleep -Seconds 5
              $retries++
          }
          if (-not $tsIP) { Write-Error "Tailscale IP not assigned"; exit 1 }
          echo "TAILSCALE_IP=$tsIP" >> $env:GITHUB_ENV
      
      - name: Verify RDP Accessibility
        run: |
          Write-Host "Tailscale IP: $env:TAILSCALE_IP"
          $testResult = Test-NetConnection -ComputerName $env:TAILSCALE_IP -Port 3389
          if (-not $testResult.TcpTestSucceeded) { Write-Error "TCP connection failed"; exit 1 }

      - name: Install Common Gaming Applications (using Chocolatey)
        run: |
          choco install googlechrome -y
          choco install AndroidStudio -y
          choco install 7zip -y
          
      - name: Install Visual C++ Runtimes
        run: |
          $urls = @(
            "https://aka.ms/vs/17/release/vc_redist.x64.exe",
            "https://aka.ms/vs/17/release/vc_redist.x86.exe"
          )
          foreach ($url in $urls) {
              $installer = "$env:TEMP\vc_redist.exe"
              Invoke-WebRequest -Uri $url -OutFile $installer
              Start-Process -FilePath $installer -ArgumentList "/install /quiet /norestart" -Wait
              Remove-Item $installer -Force
          }
      
      - name: Install DirectX and Vulkan
        run: |
          Write-Host "Vulkan runtime needs to be downloaded manually if necessary."
          Write-Host "DirectX is a core component of Windows 2022 and no extra steps are required."

      - name: Maintain Connection
        run: |
          Write-Host "`n=== RDP ACCESS ==="
          Write-Host "Address: $env:TAILSCALE_IP"
          Write-Host "Username: $env:RDP_USER"
          Write-Host "Password: $env:RDP_PASSWORD"
          Write-Host "==================`n"
          while ($true) { Start-Sleep -Seconds 300 }
